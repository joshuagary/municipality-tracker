<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Municipality Meeting Tracking System</title>
    <style>
        :root {
            --bg-color: #F4F4F0;
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --accent-red: #D92323;
            --border-dark: #121212;
            --border-light: #E0E0E0;
            --font-serif: "Playfair Display", "Georgia", serif;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            padding: 12px;
            -webkit-text-size-adjust: 100%;
        }

        header {
            border-bottom: 4px solid var(--border-dark);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.4rem, 3.5vw, 2rem);
            font-weight: 900;
            letter-spacing: -0.5px;
            margin: 0;
            text-transform: uppercase;
        }

        .sub-header {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-red);
        }

        .controls-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-dark);
            padding: 10px;
            margin-bottom: 12px;
        }

        select, input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-dark);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            background: var(--card-bg);
            border-radius: 0;
            -webkit-appearance: none;
        }

        .month-header-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-dark);
            border-bottom: none;
            padding: 8px 12px;
        }

        .month-title {
            font-family: var(--font-serif);
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-dark);
            padding: 6px 14px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        .nav-btn:active {
            background: var(--border-dark);
            color: #FFF;
        }

        .calendar-wrapper {
            width: 100%;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border-dark);
            border: 1px solid var(--border-dark);
            width: 100%;
        }

        .day-header {
            background: #000;
            color: #fff;
            padding: 6px 2px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
        }

        .day-box {
            background: var(--card-bg);
            min-height: 95px;
            padding: 4px;
            box-sizing: border-box;
            position: relative;
        }

        .day-num {
            font-weight: 800;
            font-size: 0.8rem;
            margin-bottom: 4px;
            font-family: var(--font-serif);
        }

        .event-tag {
            background-color: #F8F8F8;
            border-left: 3px solid var(--accent-red);
            border-top: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 4px;
            font-size: 0.65rem;
            line-height: 1.1;
            margin-bottom: 3px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            display: block;
            word-break: break-word;
        }

        .event-muni {
            font-weight: 800;
            color: var(--accent-red);
            margin-right: 2px;
        }

        .event-time {
            display: block;
            color: #555;
            font-size: 0.6rem;
            margin-top: 2px;
        }

        .tooltip {
            display: none;
            position: absolute;
            z-index: 100;
            background: #000000;
            color: #FFFFFF;
            padding: 10px;
            width: 220px;
            font-size: 0.75rem;
            box-shadow: 4px 4px 0px rgba(217, 35, 35, 0.8);
            pointer-events: none;
        }

        .tooltip h4 {
            margin: 0 0 4px 0;
            font-family: var(--font-serif);
            color: #FFF;
        }
    </style>
</head>
<body>

    <header>
        <div class="sub-header">Florida Real Estate & Government Intelligence</div>
        <h1>Municipality Tracker</h1>
    </header>

    <div class="controls-bar">
        <select id="muniFilter" onchange="renderEvents()">
            <option value="ALL">All Municipalities</option>
            <option value="WPB">City of West Palm Beach</option>
            <option value="PBC">Palm Beach County</option>
            <option value="BOCA">City of Boca Raton</option>
        </select>
        <select id="monthFilter" onchange="handleDropdownMonthChange()">
            <option value="2026-07">August 2026</option>
            <option value="2026-08">September 2026</option>
            <option value="2026-09">October 2026</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search keywords..." onkeyup="renderEvents()">
    </div>

    <div class="month-header-banner">
        <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
        <div class="month-title" id="displayMonthLabel">AUGUST 2026</div>
        <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
    </div>

    <div class="calendar-wrapper">
        <div class="calendar-grid">
            <div class="day-header">Sun</div>
            <div class="day-header">Mon</div>
            <div class="day-header">Tue</div>
            <div class="day-header">Wed</div>
            <div class="day-header">Thu</div>
            <div class="day-header">Fri</div>
            <div class="day-header">Sat</div>
        </div>
        
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script>
        let events = [];
        // Default initialized to August 2026 (Month index 7)
        let currentDate = new Date(2026, 7, 1); 

        const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", 
                            "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

        async function loadData() {
            try {
                const res = await fetch('data.json');
                events = await res.json();
                syncDropdownWithDate();
                renderEvents();
            } catch (e) {
                console.error("Failed to load data.json", e);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            syncDropdownWithDate();
            renderEvents();
        }

        function handleDropdownMonthChange() {
            const val = document.getElementById('monthFilter').value.split('-');
            currentDate = new Date(parseInt(val[0]), parseInt(val[1]), 1);
            renderEvents();
        }

        function syncDropdownWithDate() {
            const yr = currentDate.getFullYear();
            const mo = String(currentDate.getMonth()).padStart(2, '0');
            const targetVal = `${yr}-${mo}`;
            const select = document.getElementById('monthFilter');
            if (select.querySelector(`option[value="${targetVal}"]`)) {
                select.value = targetVal;
            }
        }

        function renderEvents() {
            const year = currentDate.getFullYear();
            const monthIdx = currentDate.getMonth();
            
            document.getElementById('displayMonthLabel').innerText = `${monthNames[monthIdx]} ${year}`;

            const muni = document.getElementById('muniFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('calendar');
            grid.innerHTML = '';

            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();

            for (let day = 1; day <= daysInMonth; day++) {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                dayBox.innerHTML = `<div class="day-num">${day}</div>`;

                events.forEach(item => {
                    const matchesMuni = (muni === 'ALL' || item.muni_short === muni);
                    const matchesSearch = item.title.toLowerCase().includes(search) || item.summary.toLowerCase().includes(search);
                    
                    const dayStr = item.date.match(/\d+/);
                    const eventDay = dayStr ? parseInt(dayStr[0]) : null;

                    if (matchesMuni && matchesSearch && eventDay === day) {
                        const tag = document.createElement('a');
                        tag.className = 'event-tag';
                        tag.href = item.link;
                        tag.target = '_blank';
                        tag.innerHTML = `<span class="event-muni">[${item.muni_short}]</span>${item.title}<span class="event-time">${item.time}</span>`;
                        
                        tag.onmousemove = (e) => showTooltip(e, item);
                        tag.onmouseleave = hideTooltip;

                        dayBox.appendChild(tag);
                    }
                });

                grid.appendChild(dayBox);
            }
        }

        function showTooltip(e, item) {
            const tt = document.getElementById('tooltip');
            tt.style.display = 'block';
            tt.style.left = Math.min(e.pageX + 10, window.innerWidth - 230) + 'px';
            tt.style.top = (e.pageY + 10) + 'px';
            tt.innerHTML = `<h4>${item.muni_full}</h4><strong>${item.title}</strong><br><br>${item.summary}`;
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        loadData();
    </script>
</body>
</html>
