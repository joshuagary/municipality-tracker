name: Municipality Scraper Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber PyPDF2 huggingface_hub curl_cffi lxml

      - name: Execute Scraper
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scraper.py

      - name: Execute Insights Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python -u insights_engine.py

      - name: Commit and Push Updated Data Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json changes.json leads.json agenda_items_cache.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated update of municipal meeting data [skip ci]"
            # main can move during the ~45 min run (manual pushes), so rebase onto it and retry
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              echo "push attempt $i failed; retrying"; sleep 5
            done
            exit 1
          fi
